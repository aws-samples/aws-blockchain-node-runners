name: ASH Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        # SHA-pinned: tj-actions/changed-files was the target of a supply-chain
        # compromise (CVE-2025-30066) where version tags were retroactively
        # repointed to a malicious commit. Pinning to an immutable commit SHA is
        # the documented mitigation. Bump deliberately, never via a floating tag.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.ts
            **/*.mts
            **/*.cts
            **/*.js
            **/*.mjs
            **/*.cjs
            **/*.json
            **/*.yaml
            **/*.yml
            **/*.sh
            **/*.mdx
            **/*.md
            **/Dockerfile*
            **/package*.json
            # Blockchain node configs frequently embed RPC endpoints, keys, or
            # seed phrases. Include all .env sample variants so secret scanners
            # (detect-secrets via ASH) inspect them on change.
            **/.env*
            **/*.env*

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v4.7.1
        with:
          python-version: '3.10'

      - name: Install ASH
        if: steps.changed-files.outputs.any_changed == 'true'
        # Use the floating @v3 tag, which awslabs maintains to always point at the
        # latest stable v3.x release. This keeps ASH current with zero maintenance
        # (Dependabot can't track this pip git ref). Trade-off: builds aren't fully
        # reproducible — pin a specific tag (e.g. @v3.5.3) if you need that.
        run: pip install git+https://github.com/awslabs/automated-security-helper.git@v3

      - name: Create temp directory for changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        # Pass the file list through the environment instead of inline ${{ }}
        # expansion. The list is derived from PR-controlled file names, so direct
        # interpolation into a shell command is a script-injection vector.
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          mkdir -p /tmp/ash-scan
          echo "Changed files for security scan:"
          echo "$ALL_CHANGED_FILES" | tr ' ' '\n'

      - name: Copy changed files to temp directory
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file in $ALL_CHANGED_FILES; do
            if [ -f "$file" ]; then
              mkdir -p "/tmp/ash-scan/$(dirname "$file")"
              cp "$file" "/tmp/ash-scan/$file"
              echo "Copied for scan: $file"
            fi
          done

      - name: Run ASH scan on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd /tmp/ash-scan
          cat > .ash_config.yaml << 'EOF'
          reporters:
            markdown:
              enabled: true
              options:
                include_detailed_findings: true
                max_detailed_findings: 100
            # flat-json is ASH's native machine-readable report, kept for the
            # artifact and the comment workflow. Enabling reporters here
            # overrides ASH's defaults, so it must be listed explicitly.
            flat-json:
              enabled: true
          scanners:
            semgrep:
              # ASH's bundled Semgrep runs its default 'p/ci' ruleset. The
              # repository's own prompt-injection rules are NOT loaded through
              # ASH: its scanner option is a single `config` value, and since
              # v3.8.0 it refuses a rule file that sits inside the scanned tree
              # (so a PR cannot choose the rules it is scanned with) and rejects
              # unknown option keys. The step "Prompt-injection scan" below runs
              # those rules with Semgrep directly, from the checkout.
              enabled: true
          EOF
          ash --mode container --config .ash_config.yaml 2>&1 | tee /tmp/ash-output.log
        # Kept non-blocking on purpose: a raw ASH exit code can't tell "found a
        # finding" from "the scanner crashed". All findings are surfaced as a PR
        # comment by the companion "ASH Security Scan - Post Comments" workflow.
        # The only blocking decision is the "Prompt-injection gate" step below,
        # which reads the direct Semgrep report, not ASH's.
        continue-on-error: true

      # The repository's prompt-injection rules, run with Semgrep directly so the
      # gate does not depend on how ASH wires scanner options (a floating @v3
      # install changed that twice). Runs from the checkout, on the changed files
      # only; the rule file's own paths.include narrows it further to the AI
      # prompt paths. Semgrep exits 1 on findings, so the exit code is captured
      # and the gate reads the JSON instead.
      - name: Prompt-injection scan
        if: steps.changed-files.outputs.any_changed == 'true'
        id: prompt-scan
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -uo pipefail
          PROMPT_FILES=()
          for f in $ALL_CHANGED_FILES; do
            case "$f" in
              docs/ageai-*.md|.kiro/prompts/*.md|.kiro/agents/*.json|.kiro/skills/*/*.md|.kiro/skills/*/*/*.md)
                [ -f "$f" ] && PROMPT_FILES+=("$f") ;;
            esac
          done
          if [ "${#PROMPT_FILES[@]}" -eq 0 ]; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "No AI prompt files changed — prompt-injection scan not applicable."
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"
          printf 'Prompt files to scan:\n'; printf '  %s\n' "${PROMPT_FILES[@]}"

          # Pinned on purpose: the gate is a security control and should not
          # change behaviour because PyPI published a new Semgrep overnight.
          # Bump deliberately when reviewing the rule file.
          pip install --quiet 'semgrep==1.185.0'
          semgrep --version

          # --no-rewrite-rule-ids keeps the rule ids as written in the YAML, so
          # the gate matches them exactly instead of a path-derived prefix.
          # Findings suppressed with an inline `nosemgrep: <rule-id>` are left
          # out of the JSON by Semgrep itself (the auditable escape hatch).
          SEMGREP_EXIT=0
          semgrep scan \
            --config .github/semgrep/prompt-injection.yml \
            --metrics=off --no-rewrite-rule-ids --no-git-ignore \
            --json --output /tmp/prompt-injection.json \
            "${PROMPT_FILES[@]}" 2>&1 | tee /tmp/prompt-injection.log || SEMGREP_EXIT=$?
          echo "exit_code=${SEMGREP_EXIT}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Process scan results
        if: steps.changed-files.outputs.any_changed == 'true'
        id: process-results
        env:
          CHANGED_FILES_COUNT: ${{ steps.changed-files.outputs.all_changed_files_count }}
        run: |
          SUMMARY_FILE="/tmp/pr_comment.md"

          echo "## 🔒 Security Scan Results" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "**Scanned files:** ${CHANGED_FILES_COUNT}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          if [ -f "/tmp/ash-output.log" ]; then
            TABLE_START=$(grep -n "ASH Scan Results Summary" /tmp/ash-output.log | head -1 | cut -d: -f1 || echo "0")
            TABLE_END=$(grep -n "source-dir:" /tmp/ash-output.log | head -1 | cut -d: -f1 || echo "0")

            if [ "$TABLE_START" != "0" ] && [ "$TABLE_END" != "0" ] && [ "$TABLE_END" -gt "$TABLE_START" ]; then
              echo "| Scanner | S | C | H | M | L | I | Result |" >> "$SUMMARY_FILE"
              echo "|---------|---|---|---|---|---|---|--------|" >> "$SUMMARY_FILE"
              sed -n "${TABLE_START},${TABLE_END}p" /tmp/ash-output.log | \
              sed 's/\x1b\[[0-9;]*m//g' | \
              grep "^│" | \
              sed 's/│/|/g' | \
              sed 's/^ *|/|/' | \
              sed 's/| *$/|/' >> "$SUMMARY_FILE"
              echo "" >> "$SUMMARY_FILE"
            fi

            if grep -q "Actionable findings detected!" /tmp/ash-output.log; then
              echo "has_findings=true" >> $GITHUB_OUTPUT
              echo "⚠️ **Security findings detected.** Please review and address before merging." >> "$SUMMARY_FILE"
            else
              echo "has_findings=false" >> $GITHUB_OUTPUT
              echo "✅ **No security issues found.**" >> "$SUMMARY_FILE"
            fi
          fi

      - name: Save PR number for comment workflow
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "${{ github.event.pull_request.number }}" > /tmp/pr_number.txt
          echo "${{ github.event.pull_request.head.sha }}" > /tmp/pr_sha.txt

      - name: Upload scan results
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-security-results
          path: |
            /tmp/ash-output.log
            /tmp/pr_comment.md
            /tmp/pr_number.txt
            /tmp/pr_sha.txt
            /tmp/prompt-injection.json
            /tmp/prompt-injection.log
          retention-days: 7

      # Narrow blocking gate. Runs AFTER the artifact upload so the companion
      # comment workflow still receives its input even when this step fails the
      # job. Only the four ERROR-severity prompt-injection rules block; the
      # WARNING jailbreak rule and every ASH finding stay advisory (surfaced in
      # the PR comment). The gate can only ever fire on PRs that modify AI
      # prompt files (docs/ageai-*.md, .kiro/prompts/*.md, .kiro/agents/*.json,
      # .kiro/skills/**/*.md) — the same paths the rules are scoped to — so it
      # has near-zero blast radius for unrelated contributions.
      - name: Prompt-injection gate
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          APPLICABLE: ${{ steps.prompt-scan.outputs.applicable }}
          SEMGREP_EXIT: ${{ steps.prompt-scan.outputs.exit_code }}
        run: |
          set -euo pipefail

          if [ "$APPLICABLE" != "true" ]; then
            echo "No AI prompt files changed — prompt-injection gate not applicable."
            exit 0
          fi

          echo "AI prompt file(s) changed — enforcing prompt-injection gate."

          # The four ERROR-severity rule IDs from
          # .github/semgrep/prompt-injection.yml. The fifth rule
          # (prompt-injection-jailbreak-or-safety-bypass, WARNING) is
          # intentionally excluded — it is the fuzziest matcher and stays
          # advisory-only.
          BLOCKING_RULES='^(prompt-injection-instruction-override|prompt-injection-reveal-system-prompt|prompt-injection-hide-from-user|prompt-injection-secret-exfiltration)$'

          REPORT=/tmp/prompt-injection.json

          # Distinguish "scan failed to run" from "scan found nothing". A PR that
          # edits a prompt file MUST have a parseable report; if it doesn't, the
          # scan didn't actually vet the prompt — fail closed instead of treating
          # a non-existent result as a clean pass. Semgrep exits 0 (clean) or 1
          # (findings) when it ran; anything else is an error.
          if [ ! -s "$REPORT" ] || ! jq -e . "$REPORT" >/dev/null 2>&1 || { [ "${SEMGREP_EXIT:-99}" != "0" ] && [ "${SEMGREP_EXIT:-99}" != "1" ]; }; then
            echo "::error::Semgrep produced no parseable results for a PR that modified AI prompt files (exit code ${SEMGREP_EXIT:-?}). This is a scan-failed-to-run state, not a clean pass. Re-run the scan; if it keeps failing, investigate before merging (see prompt-injection.log in the ash-security-results artifact)."
            exit 1
          fi

          # Semgrep also reports rule-file and target errors in .errors; a rule
          # that failed to parse would silently scan nothing, so treat that as
          # not run too.
          ERRORS=$(jq '[.errors[]? | select((.level // "error") == "error")] | length' "$REPORT")
          if [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::error::Semgrep reported ${ERRORS} error(s) while running the prompt-injection rules; the scan is not trustworthy. Details:"
            jq -r '.errors[]? | "  - \(.type // "error"): \(.message // .long_msg // "?")"' "$REPORT"
            exit 1
          fi

          HITS=$(jq --arg re "$BLOCKING_RULES" '
            [ .results[] | select(.check_id | test($re)) ] | length
          ' "$REPORT")

          if [ "${HITS:-0}" -gt 0 ]; then
            echo "::error::Prompt-injection finding(s) detected in an AI prompt file (${HITS} blocking). Review the flagged content. If it is a legitimate false positive, add an inline 'nosemgrep: <rule-id>' comment with justification on the offending line."
            echo "Blocking findings:"
            jq -r --arg re "$BLOCKING_RULES" '
              .results[] | select(.check_id | test($re))
              | "  - \(.check_id) @ \(.path):\(.start.line)"
            ' "$REPORT"
            exit 1
          fi

          ADVISORY=$(jq '[.results[] | select(.extra.severity != "ERROR")] | length' "$REPORT")
          if [ "${ADVISORY:-0}" -gt 0 ]; then
            echo "::warning::${ADVISORY} advisory (WARNING-severity) prompt-injection finding(s); not blocking. See prompt-injection.json in the artifact."
          fi

          echo "✅ No blocking prompt-injection findings in changed prompt files."

      - name: Skip message
        if: steps.changed-files.outputs.any_changed == 'false'
        run: echo "⏭️ No scannable files changed — skipping security scan"
